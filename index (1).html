<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Sarge Bookmarks</title>
<style>
:root{--bg:#0b1a10;--panel:#12261a;--card:#173222;--line:#27503a;--text:#e6f2e9;--muted:#8fb09b;--accent:#3fbf6a;--accent2:#e0b341;--danger:#d9534f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;letter-spacing:.5px;color:var(--accent2)}
input,select,textarea{background:#0e2216;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;width:100%}
#q{flex:1;min-width:160px;max-width:360px}
button{background:var(--accent);color:#06210f;border:0;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
button:hover{filter:brightness(1.15)}
.layout{display:flex;min-height:calc(100vh - 60px)}
aside{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:12px;flex-shrink:0}
aside .cat{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}
aside .cat:hover{background:var(--card)}
aside .cat.on{background:var(--card);color:var(--text);border-left:3px solid var(--accent2)}
aside .tools{display:grid;gap:6px;margin-top:14px}
main{flex:1;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card a{color:var(--text);text-decoration:none;font-weight:600;display:flex;gap:8px;align-items:center;word-break:break-word}
.card img{width:20px;height:20px;border-radius:4px}
.card small{color:var(--muted)}
.tag{align-self:flex-start;background:#0e2216;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:12px;color:var(--accent2)}
.row{display:flex;gap:6px;margin-top:auto}
.row button{padding:4px 8px;font-size:12px}
dialog{background:var(--panel);color:var(--text);border:2px solid var(--accent);border-radius:12px;width:min(440px,92vw)}
dialog::backdrop{background:#000a}
label{display:block;margin:8px 0 3px;color:var(--muted);font-size:13px}
.banner{background:#3a2f0c;border:1px solid var(--accent2);color:#f3e2a8;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
#login{max-width:380px;margin:12vh auto;text-align:center;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:28px}
.empty{color:var(--muted);text-align:center;margin-top:40px}
@media(max-width:700px){.layout{flex-direction:column}aside{width:auto;display:flex;flex-wrap:wrap;gap:4px}aside .tools{display:flex;flex-wrap:wrap}}
</style>
</head>
<body>
<div id="login" hidden>
  <h1 style="color:var(--accent2)">BIG SARGE BOOKMARKS</h1>
  <p style="color:var(--muted)">Sign in to sync your bookmarks across every device.</p>
  <button id="signin">Sign in with Google</button>
</div>

<div id="app" hidden>
<header>
  <h1>★ BIG SARGE BOOKMARKS</h1>
  <input id="q" type="search" placeholder="Search title, URL, notes…">
  <button id="add">+ Add</button>
  <button class="alt" id="out" hidden>Sign out</button>
</header>
<div class="layout">
  <aside>
    <div id="cats"></div>
    <div class="tools">
      <button class="alt" id="auto">Auto-sort Unsorted</button>
      <button class="alt" id="ren">Rename category</button>
      <button class="alt" id="imp">Import browser bookmarks</button>
      <button class="alt" id="gh">Import my GitHub sites</button>
      <button class="alt" id="exp">Export JSON</button>
      <input type="file" id="file" accept=".html,.htm" hidden>
    </div>
  </aside>
  <main>
    <div id="banner"></div>
    <div id="grid" class="grid"></div>
  </main>
</div>
</div>

<dialog id="dlg">
  <form id="form">
    <h3 id="dtitle" style="margin:0;color:var(--accent2)">Add bookmark</h3>
    <label>URL</label><input id="fu" type="url" required placeholder="https://">
    <label>Title</label><input id="ft" placeholder="Optional — defaults to the site name">
    <label>Category</label><input id="fc" list="catlist" placeholder="Unsorted"><datalist id="catlist"></datalist>
    <label>Notes</label><textarea id="fn" rows="2"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button type="button" class="alt" id="cancel">Cancel</button><button>Save</button>
    </div>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== PASTE YOUR FIREBASE WEB CONFIG HERE (Firebase Console > Project settings > Your apps) =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
// =================================================================================================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const UNS = "Unsorted";
const cloud = !firebaseConfig.apiKey.startsWith("YOUR");
let items = [], cat = "All", editing = null, colRef = null, db = null;

// ---------- storage layer (Firestore, or localStorage if no config yet) ----------
const store = {
  async add(b){ if(cloud) await addDoc(colRef,b); else {b.id=crypto.randomUUID(); items.push(b); saveLocal();} },
  async upd(id,p){ if(cloud) await updateDoc(doc(colRef,id),p); else {Object.assign(items.find(i=>i.id===id),p); saveLocal();} },
  async del(id){ if(cloud) await deleteDoc(doc(colRef,id)); else {items=items.filter(i=>i.id!==id); saveLocal();} },
  async many(list){ // list of {id?, data} adds, or {id, patch} updates
    if(cloud){
      for(let i=0;i<list.length;i+=400){
        const batch=writeBatch(db);
        list.slice(i,i+400).forEach(x=> x.id ? batch.update(doc(colRef,x.id),x.patch) : batch.set(doc(colRef),x.data));
        await batch.commit();
      }
    } else {
      list.forEach(x=> x.id ? Object.assign(items.find(i=>i.id===x.id),x.patch) : items.push({...x.data,id:crypto.randomUUID()}));
      saveLocal();
    }
  }
};
const saveLocal = () => { try{localStorage.setItem("bgt-bookmarks",JSON.stringify(items));}catch(e){} render(); };
const loadLocal = () => { try{items=JSON.parse(localStorage.getItem("bgt-bookmarks")||"[]");}catch(e){items=[];} };

// ---------- helpers ----------
const host = u => { try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u;} };
const RULES = [
  ["Dev & Code", /github|gitlab|stackoverflow|npmjs|developer\.|mdn|firebase|codepen/],
  ["Trucking", /dat\.com|truckstop|fmcsa|dot\.gov|trucker|loadboard|flyingj|pilotflying|ccjdigital|overdrive|fleet/],
  ["Video", /youtube|youtu\.be|vimeo|twitch|netflix/],
  ["Shopping", /amazon|ebay|walmart|etsy|homedepot|lowes|harborfreight|autozone|napa|rockauto/],
  ["Social", /facebook|twitter|x\.com|instagram|reddit|linkedin|tiktok/],
  ["News & Weather", /cnn|foxnews|nytimes|weather|noaa|apnews|reuters/],
  ["Finance", /bank|paypal|chase|irs\.gov|quickbooks|fidelity|schwab/],
  ["Military & VA", /va\.gov|army|military|dod|tricare|ebenefits/],
  ["Maps & Travel", /maps\.google|google\.com\/maps|waze|airbnb|expedia|tripadvisor/]
];
const guess = u => (RULES.find(r=>r[1].test(u.toLowerCase()))||[UNS])[0];
const cats = () => { const m={}; items.forEach(i=>{const c=i.category||UNS; m[c]=(m[c]||0)+1;}); return m; };

// ---------- render ----------
function render(){
  const m = cats(), names = Object.keys(m).sort((a,b)=>a.localeCompare(b));
  if(cat!=="All" && !m[cat]) cat="All";
  $("cats").innerHTML = [["All",items.length],...names.map(n=>[n,m[n]])]
    .map(([n,c])=>`<div class="cat ${n===cat?"on":""}" data-c="${esc(n)}"><span>${esc(n)}</span><span>${c}</span></div>`).join("");
  $("catlist").innerHTML = names.map(n=>`<option value="${esc(n)}">`).join("");
  const q = $("q").value.trim().toLowerCase();
  const list = items.filter(i => (cat==="All"||(i.category||UNS)===cat) &&
    (!q || [i.title,i.url,i.notes,i.category].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  $("grid").innerHTML = list.length ? list.map(i=>`
    <div class="card">
      <a href="${esc(i.url)}" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=${esc(host(i.url))}&sz=64" alt="">${esc(i.title||host(i.url))}</a>
      <small>${esc(host(i.url))}</small>
      <span class="tag">${esc(i.category||UNS)}</span>
      ${i.notes?`<small>${esc(i.notes)}</small>`:""}
      <div class="row"><button class="alt" data-e="${i.id}">Edit</button><button class="danger" data-d="${i.id}">Delete</button></div>
    </div>`).join("") : `<div class="empty">No bookmarks here yet. Hit “+ Add” or import your browser bookmarks.</div>`;
}

// ---------- events ----------
$("cats").onclick = e => { const c=e.target.closest(".cat"); if(c){cat=c.dataset.c; render();} };
$("q").oninput = render;
$("grid").onclick = async e => {
  const ed=e.target.dataset.e, de=e.target.dataset.d;
  if(ed) openDlg(items.find(i=>i.id===ed));
  if(de && confirm("Delete this bookmark?")) await store.del(de);
};
function openDlg(b){
  editing=b||null; $("dtitle").textContent=b?"Edit bookmark":"Add bookmark";
  $("fu").value=b?.url||""; $("ft").value=b?.title||""; $("fc").value=b?.category||(cat!=="All"?cat:""); $("fn").value=b?.notes||"";
  $("dlg").showModal();
}
$("add").onclick = () => openDlg();
$("cancel").onclick = () => $("dlg").close();
$("form").onsubmit = async e => {
  e.preventDefault();
  const data={url:$("fu").value.trim(),title:$("ft").value.trim()||host($("fu").value),category:$("fc").value.trim()||UNS,notes:$("fn").value.trim()};
  if(editing) await store.upd(editing.id,data); else await store.add({...data,created:Date.now()});
  $("dlg").close();
};
$("auto").onclick = async () => {
  const list=items.filter(i=>(i.category||UNS)===UNS).map(i=>({id:i.id,patch:{category:guess(i.url)}})).filter(x=>x.patch.category!==UNS);
  if(!list.length) return alert("Nothing to auto-sort — no Unsorted bookmarks matched a rule.");
  await store.many(list); alert(list.length+" bookmarks sorted.");
};
$("ren").onclick = async () => {
  if(cat==="All") return alert("Click a category on the left first, then Rename.");
  const n=prompt("New name for “"+cat+"”:",cat); if(!n||n===cat) return;
  const old=cat; await store.many(items.filter(i=>(i.category||UNS)===old).map(i=>({id:i.id,patch:{category:n.trim()}}))); cat=n.trim();
};
$("imp").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  const dom=new DOMParser().parseFromString(await f.text(),"text/html");
  const have=new Set(items.map(i=>i.url)), out=[];
  dom.querySelectorAll("a[href]").forEach(a=>{
    const url=a.href; if(!/^https?:/.test(url)||have.has(url)) return; have.add(url);
    const dl=a.closest("dl"); let h=dl&&(dl.parentElement?.querySelector(":scope > h3")||(dl.previousElementSibling?.tagName==="H3"?dl.previousElementSibling:null));
    out.push({data:{url,title:a.textContent.trim()||host(url),category:h?.textContent.trim()||"Imported",notes:"",created:Date.now()}});
  });
  if(!out.length) return alert("No new bookmarks found in that file.");
  await store.many(out); alert(out.length+" bookmarks imported."); e.target.value="";
};
$("gh").onclick = async () => {
  const u=(prompt("GitHub username:","bigsarge1999")||"").trim(); if(!u) return;
  try{
    const r=await fetch(`https://api.github.com/users/${encodeURIComponent(u)}/repos?per_page=100`);
    if(!r.ok) throw new Error("GitHub said "+r.status+(r.status===403?" (rate limit, try again later)":""));
    const have=new Set(items.map(i=>i.url));
    const out=(await r.json()).filter(x=>x.has_pages).map(x=>{
      const url=x.homepage&&/^https?:/.test(x.homepage)?x.homepage
        :(x.name.toLowerCase()===u.toLowerCase()+".github.io"?`https://${u}.github.io/`:`https://${u}.github.io/${x.name}/`);
      return {data:{url,title:x.name,category:"My Sites",notes:x.description||"",created:Date.now()}};
    }).filter(x=>!have.has(x.data.url));
    if(!out.length) return alert("No new GitHub Pages sites found for "+u+".");
    await store.many(out); alert(out.length+" sites imported into “My Sites”.");
  }catch(e){ alert("Import failed: "+e.message); }
};
$("exp").onclick = () => {
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(items.map(({id,...r})=>r),null,2)],{type:"application/json"}));
  a.download="bookmarks-backup.json"; a.click();
};

// ---------- start up ----------
function start(){ $("login").hidden=true; $("app").hidden=false; render(); }
if(cloud){
  const app=initializeApp(firebaseConfig), auth=getAuth(app); db=getFirestore(app);
  $("signin").onclick = () => signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));
  $("out").hidden=false; $("out").onclick=()=>signOut(auth);
  let unsub=null;
  onAuthStateChanged(auth,user=>{
    if(unsub){unsub();unsub=null;}
    if(!user){ $("app").hidden=true; $("login").hidden=false; items=[]; return; }
    colRef=collection(db,"users",user.uid,"bookmarks");
    unsub=onSnapshot(colRef,s=>{ items=s.docs.map(d=>({id:d.id,...d.data()})); start(); },e=>alert("Firestore error: "+e.message));
  });
} else {
  $("banner").innerHTML='<div class="banner">Local mode: Firebase config not set, so bookmarks are saved in this browser only. Paste your Firebase config into the top of the script to turn on cloud sync.</div>';
  loadLocal(); start();
}
</script>
</body>
</html>
